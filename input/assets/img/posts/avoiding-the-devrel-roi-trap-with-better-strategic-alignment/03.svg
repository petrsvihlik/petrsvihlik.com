<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="The same Venn diagram, annotated: the pairwise intersections are other people's job, what's forced upon us, and what the company doesn't understand">
  <rect x="1" y="1" width="1198" height="798" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ devrel strategy --derive --verbose</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <g>
    <circle cx="460" cy="330" r="240" fill="#ff79c6" fill-opacity="0.10" stroke="#ff79c6" stroke-width="2.5"/>
    <circle cx="740" cy="330" r="240" fill="#e7c46b" fill-opacity="0.10" stroke="#e7c46b" stroke-width="2.5"/>
    <circle cx="600" cy="530" r="240" fill="#4fd6e0" fill-opacity="0.10" stroke="#4fd6e0" stroke-width="2.5"/>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="350" y="230" font-size="26" fill="#ff79c6">COMPANY</text>
    <text x="350" y="265" font-size="26" fill="#ff79c6">STRATEGY</text>
    <text x="860" y="230" font-size="26" fill="#e7c46b">DEVELOPERS'</text>
    <text x="860" y="265" font-size="26" fill="#e7c46b">NEEDS</text>
    <text x="600" y="690" font-size="26" fill="#4fd6e0">WHAT 🥑🥑 ARE GOOD AT</text>

    <text x="600" y="235" font-size="17" fill="#f0a35e">what's other</text>
    <text x="600" y="260" font-size="17" fill="#f0a35e">people's job</text>

    <text x="472" y="500" font-size="17" fill="#8a93a0">what's forced</text>
    <text x="472" y="525" font-size="17" fill="#8a93a0">upon us by</text>
    <text x="472" y="550" font-size="17" fill="#8a93a0">the company</text>

    <text x="732" y="500" font-size="17" fill="#c79bf2">what the</text>
    <text x="732" y="525" font-size="17" fill="#c79bf2">company doesn't</text>
    <text x="732" y="550" font-size="17" fill="#c79bf2">understand</text>
  </g>

  <rect x="500" y="368" width="200" height="76" rx="8" fill="#11151c" stroke="#93dca2" stroke-width="2.5"/>
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" font-size="22" fill="#93dca2">
    <text x="600" y="400">DEVREL</text>
    <text x="600" y="430">STRATEGY</text>
  </g>
</svg>

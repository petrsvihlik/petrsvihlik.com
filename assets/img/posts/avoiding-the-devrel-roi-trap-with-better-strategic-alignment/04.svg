<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Org chart where goals cascade from the exec team down into every department and results roll back up — DevRel included">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a0"/>
    </marker>
    <marker id="arrdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#515b69"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="638" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ okr align --cascade --roll-up</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <!-- goals cascade: exec → around the outside → into each team from below (dashed) -->
  <g fill="none" stroke="#515b69" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrdim)">
    <path d="M 500 132 C 130 140, 70 440, 174 490 L 175 416"/>
    <path d="M 500 160 C 290 220, 300 440, 394 480 L 395 416"/>
    <path d="M 545 182 C 480 300, 500 430, 614 472 L 615 416"/>
    <path d="M 700 160 C 910 220, 900 440, 836 480 L 835 416"/>
    <path d="M 700 132 C 1070 140, 1130 440, 1041 490 L 1040 416"/>
  </g>

  <!-- results roll up: teams → exec (solid) -->
  <g fill="none" stroke="#515b69" stroke-width="2" marker-end="url(#arr)">
    <path d="M 205 348 C 240 250, 440 200, 508 176"/>
    <path d="M 415 348 C 440 270, 500 220, 548 188"/>
    <path d="M 625 348 L 612 190"/>
    <path d="M 815 348 C 790 270, 720 224, 664 188"/>
    <path d="M 1010 348 C 970 250, 770 200, 692 176"/>
  </g>
  <!-- devrel's roll-up, emphasized -->
  <path d="M 165 348 C 160 230, 380 170, 496 152" fill="none" stroke="#4fd6e0" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- exec box -->
  <rect x="500" y="110" width="200" height="64" rx="6" fill="#11151c" stroke="#93dca2" stroke-width="2.5"/>
  <text x="600" y="149" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#93dca2">exec team</text>

  <!-- team boxes -->
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <rect x="90"  y="348" width="170" height="60" rx="6" fill="#11151c" stroke="#4fd6e0" stroke-width="2.5"/>
    <text x="175" y="385" fill="#4fd6e0">devrel</text>
    <rect x="310" y="348" width="170" height="60" rx="6" fill="#11151c" stroke="#283040" stroke-width="2"/>
    <text x="395" y="385" fill="#d8dee6">support</text>
    <rect x="530" y="348" width="170" height="60" rx="6" fill="#11151c" stroke="#283040" stroke-width="2"/>
    <text x="615" y="385" fill="#d8dee6">engineering</text>
    <rect x="750" y="348" width="170" height="60" rx="6" fill="#11151c" stroke="#283040" stroke-width="2"/>
    <text x="835" y="385" fill="#d8dee6">marketing</text>
    <rect x="970" y="348" width="140" height="60" rx="6" fill="#11151c" stroke="#283040" stroke-width="2"/>
    <text x="1040" y="385" fill="#d8dee6">sales</text>
  </g>

  <!-- direction legend -->
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17">
    <text x="90" y="250" fill="#515b69">goals ↓</text>
    <text x="330" y="250" fill="#8a93a0">results ↑</text>
  </g>

  <text x="90" y="586" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#515b69">// goals cascade down, results roll up — same stories at every altitude</text>
</svg>

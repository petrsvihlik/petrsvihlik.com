<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="ME equals how I treat people at work plus at a party plus at home — the same person in every context">
  <rect x="1" y="1" width="1198" height="358" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ whoami --consistent</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24">
    <text x="90" y="130"><tspan fill="#c79bf2">const</tspan> <tspan fill="#d8dee6">ME</tspan> <tspan fill="#8a93a0">=</tspan></text>
    <text x="130" y="172"><tspan fill="#93dca2">how_i_treat_people</tspan><tspan fill="#8a93a0">(</tspan><tspan fill="#4fd6e0">at:</tspan> <tspan fill="#e7c46b">work</tspan><tspan fill="#8a93a0">)</tspan></text>
    <text x="90" y="214"><tspan fill="#8a93a0">+</tspan> <tspan fill="#93dca2">how_i_treat_people</tspan><tspan fill="#8a93a0">(</tspan><tspan fill="#4fd6e0">at:</tspan> <tspan fill="#e7c46b">party</tspan><tspan fill="#8a93a0">)</tspan></text>
    <text x="90" y="256"><tspan fill="#8a93a0">+</tspan> <tspan fill="#93dca2">how_i_treat_people</tspan><tspan fill="#8a93a0">(</tspan><tspan fill="#4fd6e0">at:</tspan> <tspan fill="#e7c46b">home</tspan><tspan fill="#8a93a0">)</tspan></text>
    <text x="90" y="298"><tspan fill="#8a93a0">+</tspan> <tspan fill="#93dca2">how_i_treat_people</tspan><tspan fill="#8a93a0">(</tspan><tspan fill="#4fd6e0">at:</tspan> <tspan fill="#e7c46b">...</tspan><tspan fill="#8a93a0">)</tspan><tspan fill="#8a93a0">;</tspan>  <tspan fill="#515b69">// honesty is the key</tspan></text>
  </g>
</svg>

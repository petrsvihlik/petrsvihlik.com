<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Three fish: culture eats strategy, strategy eats metrics">
  <defs>
    <g id="fish" fill="#11151c" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- body with open mouth, facing left -->
      <path vector-effect="non-scaling-stroke" d="M -50 -13
        C -28 -24, 0 -26, 20 -18
        C 32 -12, 38 -6, 40 0
        C 38 6, 32 12, 20 18
        C 0 26, -28 24, -50 13
        L -24 0
        Z"/>
      <!-- forked tail -->
      <path vector-effect="non-scaling-stroke" d="M 40 0
        C 48 -7, 53 -14, 61 -21
        C 57 -8, 57 8, 61 21
        C 53 14, 48 7, 40 0
        Z"/>
      <!-- dorsal fin -->
      <path vector-effect="non-scaling-stroke" d="M -6 -23 C 0 -32, 12 -31, 16 -20"/>
      <!-- pelvic fin -->
      <path vector-effect="non-scaling-stroke" d="M 2 23 C 7 31, 15 30, 18 21"/>
      <!-- gill -->
      <path vector-effect="non-scaling-stroke" fill="none" d="M -12 -12 C -6 -4, -6 4, -12 12"/>
      <!-- eye -->
      <circle vector-effect="non-scaling-stroke" cx="-31" cy="-7" r="3" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ ps aux | grep food-chain</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <use href="#fish" color="#8a93a0" transform="translate(320 262) scale(0.65)"/>
  <use href="#fish" color="#e7c46b" transform="translate(525 256) scale(1.1)"/>
  <use href="#fish" color="#4fd6e0" transform="translate(870 250) scale(1.9)"/>

  <!-- bubbles -->
  <g fill="none" stroke="#515b69" stroke-width="1.5">
    <circle cx="280" cy="224" r="4"/>
    <circle cx="455" cy="200" r="5"/>
    <circle cx="468" cy="176" r="3"/>
    <circle cx="752" cy="168" r="7"/>
    <circle cx="770" cy="136" r="4"/>
    <circle cx="742" cy="112" r="3"/>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" text-anchor="middle">
    <text x="330" y="330" fill="#8a93a0">metrics</text>
    <text x="535" y="350" fill="#e7c46b">strategy</text>
    <text x="880" y="392" fill="#4fd6e0">culture</text>
  </g>

  <text x="90" y="130" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#515b69">// breakfast is served at every level of abstraction</text>
</svg>

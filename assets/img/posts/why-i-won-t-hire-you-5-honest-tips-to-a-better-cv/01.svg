<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A one-page CV read against a ninety-second budget">
  <rect x="1" y="1" width="1198" height="628" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ timeout 90s less cv.pdf</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <!-- the one page -->
  <rect x="150" y="120" width="330" height="440" rx="6" fill="#11151c" stroke="#283040" stroke-width="2"/>
  <g>
    <rect x="185" y="160" width="180" height="16" rx="4" fill="#4fd6e0"/>
    <rect x="185" y="192" width="120" height="10" rx="4" fill="#515b69"/>

    <rect x="185" y="240" width="90" height="12" rx="4" fill="#8a93a0"/>
    <rect x="185" y="268" width="260" height="10" rx="4" fill="#283040"/>
    <rect x="185" y="288" width="240" height="10" rx="4" fill="#283040"/>
    <rect x="185" y="308" width="255" height="10" rx="4" fill="#283040"/>

    <rect x="185" y="356" width="110" height="12" rx="4" fill="#8a93a0"/>
    <rect x="185" y="384" width="250" height="10" rx="4" fill="#283040"/>
    <rect x="185" y="404" width="230" height="10" rx="4" fill="#283040"/>

    <rect x="185" y="452" width="70" height="12" rx="4" fill="#8a93a0"/>
    <rect x="185" y="480" width="150" height="10" rx="4" fill="#93dca2"/>
    <rect x="185" y="500" width="120" height="10" rx="4" fill="#93dca2"/>
  </g>
  <text x="315" y="595" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#8a93a0">1 / 1</text>

  <!-- the reader's budget -->
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <circle cx="800" cy="250" r="90" fill="none" stroke="#283040" stroke-width="10"/>
    <path d="M 800 160 A 90 90 0 1 1 722 295" fill="none" stroke="#e7c46b" stroke-width="10" stroke-linecap="round"/>
    <text x="800" y="243" text-anchor="middle" font-size="34" fill="#d8dee6">90s</text>
    <text x="800" y="277" text-anchor="middle" font-size="16" fill="#8a93a0">of attention</text>

    <text x="620" y="430" font-size="20" fill="#8a93a0">pages:      <tspan fill="#93dca2">1 ✓</tspan></text>
    <text x="620" y="468" font-size="20" fill="#8a93a0">relevant:   <tspan fill="#93dca2">all of it ✓</tspan></text>
    <text x="620" y="506" font-size="20" fill="#8a93a0">skill bars: <tspan fill="#93dca2">none ✓</tspan></text>
    <text x="620" y="556" font-size="18" fill="#515b69">// → interview scheduled</text>
  </g>
</svg>

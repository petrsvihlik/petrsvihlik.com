<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A three-step pipeline for rebooting a life: read the right book, run a retrospective, talk to your friends — with one skeleton found in the closet">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="628" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ life --reboot 2018</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="90" y="200" width="300" height="130" rx="6" fill="#11151c" stroke="#4fd6e0" stroke-width="2.5"/>
    <text x="240" y="252" text-anchor="middle" font-size="20" fill="#515b69">step 1/3</text>
    <text x="240" y="288" text-anchor="middle" font-size="22" fill="#4fd6e0">set your values</text>

    <rect x="450" y="200" width="300" height="130" rx="6" fill="#11151c" stroke="#e7c46b" stroke-width="2.5"/>
    <text x="600" y="252" text-anchor="middle" font-size="20" fill="#515b69">step 2/3</text>
    <text x="600" y="288" text-anchor="middle" font-size="22" fill="#e7c46b">audit your year</text>

    <rect x="810" y="200" width="300" height="130" rx="6" fill="#11151c" stroke="#93dca2" stroke-width="2.5"/>
    <text x="960" y="252" text-anchor="middle" font-size="20" fill="#515b69">step 3/3</text>
    <text x="960" y="288" text-anchor="middle" font-size="22" fill="#93dca2">tell your friends</text>
  </g>

  <g fill="none" stroke="#8a93a0" stroke-width="2" marker-end="url(#arr)">
    <line x1="390" y1="265" x2="442" y2="265"/>
    <line x1="750" y1="265" x2="802" y2="265"/>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <text x="90" y="430" fill="#8a93a0">scanning closet...</text>
    <text x="90" y="470" fill="#d8dee6">skeletons found: <tspan fill="#ff6b6b">1</tspan></text>
    <text x="90" y="510" fill="#93dca2">→ engaging <tspan fill="#515b69">// lock and load</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Migrating more than ten repositories from AppVeyor to GitHub Actions over one weekend">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="628" rx="8" fill="#0e1117" stroke="#283040" stroke-width="2"/>
  <circle cx="36" cy="38" r="7" fill="#ff6b6b"/>
  <circle cx="62" cy="38" r="7" fill="#e7c46b"/>
  <circle cx="88" cy="38" r="7" fill="#93dca2"/>
  <text x="116" y="45" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8a93a0">$ ci migrate --all --weekend</text>
  <line x1="1" y1="64" x2="1199" y2="64" stroke="#1b212b" stroke-width="2"/>

  <rect x="110" y="190" width="340" height="150" rx="6" fill="#11151c" stroke="#283040" stroke-width="2" stroke-dasharray="10 8"/>
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="280" y="255" font-size="24" fill="#8a93a0">appveyor.yml</text>
    <text x="280" y="295" font-size="18" fill="#515b69">+ travis + circle + ...</text>
  </g>

  <line x1="450" y1="265" x2="740" y2="265" stroke="#8a93a0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="595" y="240" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#8a93a0">10+ repos</text>

  <rect x="750" y="190" width="340" height="150" rx="6" fill="#11151c" stroke="#4fd6e0" stroke-width="2.5"/>
  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="920" y="255" font-size="24" fill="#4fd6e0">.github/workflows</text>
    <text x="920" y="295" font-size="18" fill="#8a93a0">one CI for every stack</text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
    <text x="110" y="440" fill="#93dca2">✓ restore   ✓ build   ✓ test   ✓ pack   ✓ publish</text>
    <text x="110" y="490" fill="#e7c46b">! windows ≠ linux <tspan fill="#515b69">// serialization surprises ahead</tspan></text>
  </g>

  <text x="110" y="566" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#515b69">// JS · .NET · PHP · Java · Swift · Android · Ruby — one weekend</text>
</svg>
